---
- name: Include MySQL Variables
  include_vars: "{{ role_path }}/vars/main.yml"

- name: Ensure Python 2 RPM Bindings Are Installed
  yum:
    name: python2-rpm
    state: present
  become: yes
  vars:
    ansible_python_interpreter: /usr/bin/python2

- name: Ensure Python 3 RPM Bindings Are Installed
  yum:
    name: python3-rpm
    state: present
  become: yes
  vars:
    ansible_python_interpreter: /usr/bin/python2

- name: Install MariaDB Server
  yum:
    name: mariadb-server
    state: present
  become: yes
  vars:
    ansible_python_interpreter: /usr/bin/python2

- name: Start and Enable MariaDB Service
  service:
    name: mariadb
    state: started
    enabled: yes
  become: yes

- name: Install Python 3 and pip (for PyMySQL)
  yum:
    name: python3-pip
    state: present
  become: yes
  vars:
    ansible_python_interpreter: /usr/bin/python2

- name: Ensure pip is available
  command: pip3 --version
  register: pip_status
  become: yes

- name: Print pip Status
  debug:
    msg: "{{ pip_status.stdout_lines }}"

- name: Install PyMySQL via pip
  pip:
    name: pymysql
    state: present
    executable: pip3  # Explicitly use pip3
  become: yes

- name: Ensure MariaDB is Running
  command: systemctl status mariadb
  register: mariadb_status
  become: yes
  ignore_errors: yes

- name: Print MariaDB Status
  debug:
    msg: "{{ mariadb_status.stdout_lines }}"

# Check current plugin method for root user (without root password)
- name: Check MySQL root plugin
  community.mysql.mysql_query:
    login_user: root
    login_password: "{{ mysql_root_password }}"    
    query: "SELECT plugin FROM mysql.user WHERE user='root' AND host='localhost';"
  register: mysql_root_plugin
  become: yes
  ignore_errors: true

- name: Show plugin used by root
  debug:
    msg: "Root user is using {{ mysql_root_plugin.query_result[0].plugin | default('UNKNOWN') }}"

# Secure installation: set root password, ensure it's using login_user and login_password
- name: Secure MariaDB Installation (Set Root Password)
  community.mysql.mysql_user:
    name: root
    host: localhost
    password: "{{ mysql_root_password }}"
    login_user: root
    login_password: "{{ mysql_root_password }}"
    state: present
  become: yes

- name: Create WordPress Database
  community.mysql.mysql_db:
    name: "{{ wordpress_db_name }}"
    state: present
    login_user: root
    login_password: "{{ mysql_root_password }}"
  become: yes

- name: Create WordPress User
  community.mysql.mysql_user:
    name: "{{ wordpress_db_user }}"
    password: "{{ wordpress_db_password }}"
    priv: "{{ wordpress_db_name }}.*:ALL"
    state: present
    login_user: root
    login_password: "{{ mysql_root_password }}"
  become: yes

- name: Ensure Remote Access for WordPress User
  community.mysql.mysql_user:
    name: "{{ wordpress_db_user }}"
    host: "%"
    password: "{{ wordpress_db_password }}"
    priv: "{{ wordpress_db_name }}.*:ALL"
    state: present
    login_user: root
    login_password: "{{ mysql_root_password }}"
  become: yes

- name: Restart MariaDB Service
  service:
    name: mariadb
    state: restarted
  become: yes

# WordPress Tasks
- name: Install Apache and PHP (WordPress) using dnf
  yum: 
    name:
      - httpd
      - php
      - php-mysqlnd
      - php-fpm
    state: present
  become: yes
  vars:
    ansible_python_interpreter: /usr/bin/python2

- name: Start and Enable Apache
  service:
    name: httpd
    state: started
    enabled: yes
  become: yes

- name: Ensure PHP is installed
  command: php -v
  register: php_version
  become: yes

- name: Print PHP Version
  debug:
    msg: "{{ php_version.stdout }}"

